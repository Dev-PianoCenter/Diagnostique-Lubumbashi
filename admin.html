<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Piano Center</title>
    <link rel="icon" type="image/png" href="./images/Favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <header>
        <img src="./images/Logo.png" alt="" class="logo">
        <p>Gestion des diagnostics<br>Piano Center Lubumbashi</p>
    </header>

    <div class="admin-container">
        <div class="stats-bar">
            <div class="counter">
                <span id="totalCount">0</span> Diagnostics reçus
            </div>
            <div class="controls">
                <button class="btn-clear btn-secondary" onclick="clearAllResponses()">Tout effacer</button>
                <button class="btn-secondary" onclick="sortResponses('date')">Trier par Date</button>
                <button class="btn-secondary" onclick="sortResponses('nom')">Trier par Nom</button>
                <button class="btn-primary no-flex" onclick="loadResponses()">Actualiser</button>
            </div>
            <div id="paginationTop" class="pagination-container"></div>
        </div>

        <div id="responsesList">
            <div class="loader">Chargement des données...</div>
        </div>
    </div>

    <div id="paginationBottom" class="pagination-container bottom-right"></div>

    <script src="js/admin.js"></script>
</body>
</html>
