<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Piano Center</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1000px;
            width: 95%;
            margin-top: 20px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }
        .counter {
            font-size: 1.2rem;
            font-weight: 800;
        }
        .counter span {
            color: var(--primary);
            font-size: 2rem;
            margin-right: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        .response-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }
        .response-card:hover {
            border-color: var(--primary);
        }
        .resp-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .resp-name {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
        }
        .resp-date {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .resp-details {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            font-size: 0.9rem;
        }
        .detail-item {
            margin-bottom: 10px;
        }
        .detail-label {
            color: var(--text-muted);
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .detail-val {
            font-weight: 600;
        }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(197, 160, 89, 0.2);
            color: var(--primary);
            font-size: 0.7rem;
            margin-right: 5px;
            margin-top: 5px;
        }
        .loader {
            text-align: center;
            padding: 50px;
            color: var(--text-muted);
        }
        .no-data {
            text-align: center;
            padding: 40px;
            background: rgba(0,0,0,0.1);
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
        .btn-delete {
            background: transparent;
            color: #ff4d4d;
            border: 1px solid #ff4d4d33;
            padding: 4px 12px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: #ff4d4d1a;
            border-color: #ff4d4d;
        }
        .btn-clear {
            background: #ff4d4d1a;
            color: #ff4d4d;
            border: 1px solid #ff4d4d33;
            margin-right: 15px;
        }
        .btn-clear:hover {
            background: #ff4d4d;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>DASHBOARD ADMIN</h1>
        <p>Gestion des diagnostics<br>Piano Center Lubumbashi</p>
    </header>

    <div class="admin-container">
        <div class="stats-bar">
            <div class="counter">
                <span id="totalCount">0</span> Diagnostics reçus
            </div>
            <div class="controls">
                <button class="btn-clear btn-secondary" onclick="clearAllResponses()">Tout effacer</button>
                <button class="btn-secondary" onclick="sortResponses('date')">Trier par Date</button>
                <button class="btn-secondary" onclick="sortResponses('nom')">Trier par Nom</button>
                <button class="btn-primary" onclick="loadResponses()" style="flex: 0;">Actualiser</button>
            </div>
        </div>

        <div id="responsesList">
            <div class="loader">Chargement des données...</div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
